# The installer for this commit, for Windows (recomp-launcher with
# launcher/launcher.json). The repo is private, so it runs only by hand
# (REPO_RULES section 8: Actions minutes on a private repo cost money):
# gh workflow run installer.yml
name: installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    uses: sp00nznet/recomp-launcher/.github/workflows/installer.yml@main
    with:
      name: Shogo-Recomp-Installer
      platforms: windows
